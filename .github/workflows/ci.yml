name: CI

# Why this workflow looks unusual
# --------------------------------
# The maintainer's machine has no Flutter/Dart/Android toolchain (not enough
# disk), so this workflow IS the build machine. Two consequences:
#
#  1. Every verification step runs with `continue-on-error` and a final "Gate"
#     step fails the job. One run therefore reports *everything* that is wrong
#     (pub resolution, codegen, analyzer, tests, APK) instead of stopping at the
#     first failure — each CI round-trip is minutes, so we want the full picture.
#  2. Logs and generated files are pushed to a `ci-reports` branch (force-pushed,
#     latest run only) so a person or an AI agent can `git fetch origin
#     ci-reports` and read them. No `gh` CLI or API token is needed on the
#     reading side. Nothing secret is ever written to that branch.

on:
  push:
    branches-ignore: [ci-reports]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only used by the "Publish report" step to update `ci-reports`

env:
  FLUTTER_VERSION: "3.47.4" # stable, Dart 3.13.3 — pin so results are reproducible
  # SafStorageHostApi.kt was reconciled with the generated StorageApi.g.kt
  # (session 1, after run #5), so it now builds with everything else. Flip to
  # "true" only to bisect a Kotlin compile failure.
  EXCLUDE_SAF_DRAFT: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash # => bash -eo pipefail, so `cmd | tee log` still fails on cmd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare report directory
        run: mkdir -p ci-report/logs ci-report/generated

      - name: Toolchain versions
        run: |
          { flutter --version; echo; dart --version; echo; java -version; } 2>&1 | tee ci-report/logs/versions.log

      # `flutter create .` would also drop a default test/widget_test.dart that
      # references a counter app and breaks `flutter test`. Generate into a scratch
      # dir instead and copy only android/, without clobbering committed files.
      - name: Scaffold android/ if it is not committed yet
        id: scaffold
        run: |
          if [ -f android/build.gradle ] || [ -f android/build.gradle.kts ]; then
            echo "android/ scaffold already committed - skipping"
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          flutter create --platforms=android --org com.vaultbox --project-name app \
            "$RUNNER_TEMP/scaffold" 2>&1 | tee ci-report/logs/scaffold.log
          mkdir -p android
          cp -rn "$RUNNER_TEMP/scaffold/android/." android/
          # Pristine copy (before any build output exists) for committing back.
          mkdir -p ci-report/android-scaffold
          cp -r "$RUNNER_TEMP/scaffold/android/." ci-report/android-scaffold/
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: flutter pub get
        id: pub_get
        continue-on-error: true
        run: flutter pub get 2>&1 | tee ci-report/logs/pub_get.log

      - name: Drift codegen (build_runner)
        id: build_runner
        if: steps.pub_get.outcome == 'success'
        continue-on-error: true
        run: dart run build_runner build --delete-conflicting-outputs 2>&1 | tee ci-report/logs/build_runner.log

      - name: Pigeon codegen (SAF bridge)
        id: pigeon
        if: steps.pub_get.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p lib/platform/pigeon android/app/src/main/kotlin/com/vaultbox/app/pigeon
          dart run pigeon --input pigeons/storage_api.dart 2>&1 | tee ci-report/logs/pigeon.log

      - name: dart format (advisory)
        id: format
        if: steps.pub_get.outcome == 'success'
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test pigeons 2>&1 | tee ci-report/logs/format.log

      # Only real errors fail this step; infos/warnings are still logged and
      # reviewed from the report. Tighten to --fatal-infos once the backlog is clear.
      - name: flutter analyze
        id: analyze
        if: steps.pub_get.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ci-report/logs/analyze.log
          code=${PIPESTATUS[0]}
          # Surface the first few errors as annotations too (readable via the API).
          grep -E '^\s*error •' ci-report/logs/analyze.log | head -10 | while IFS= read -r line; do echo "::error::${line}"; done
          exit "$code"

      - name: flutter test
        id: test
        if: steps.pub_get.outcome == 'success'
        continue-on-error: true
        run: flutter test --reporter expanded 2>&1 | tee ci-report/logs/test.log

      - name: flutter build apk (debug)
        id: apk
        if: steps.pub_get.outcome == 'success'
        continue-on-error: true
        run: |
          if [ "$EXCLUDE_SAF_DRAFT" = "true" ]; then
            f=android/app/src/main/kotlin/com/vaultbox/app/storage/SafStorageHostApi.kt
            [ -f "$f" ] && mv "$f" "$RUNNER_TEMP/SafStorageHostApi.kt.draft" && echo "excluded unreconciled SAF draft from this build"
          fi
          flutter build apk --debug 2>&1 | tee ci-report/logs/build_apk.log

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vaultbox-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Assemble report
        if: always()
        run: |
          # Generated bridge code, so the Kotlin side can be reconciled against reality.
          cp lib/platform/pigeon/*.g.dart ci-report/generated/ 2>/dev/null || true
          cp android/app/src/main/kotlin/com/vaultbox/app/pigeon/*.kt ci-report/generated/ 2>/dev/null || true
          cp pubspec.lock ci-report/pubspec.lock 2>/dev/null || true
          # Keep the branch small: cap each log at 300 KB (the tail is what matters).
          for f in ci-report/logs/*.log; do
            [ -f "$f" ] || continue
            if [ "$(stat -c%s "$f")" -gt 300000 ]; then tail -c 300000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; fi
          done
          {
            echo "# CI report"
            echo
            echo "- ref: \`${GITHUB_REF_NAME}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- flutter: ${FLUTTER_VERSION}   exclude_saf_draft: ${EXCLUDE_SAF_DRAFT}"
            echo "- android scaffold generated this run: ${{ steps.scaffold.outputs.generated }}"
            echo
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| pub get | ${{ steps.pub_get.outcome }} |"
            echo "| build_runner (drift) | ${{ steps.build_runner.outcome }} |"
            echo "| pigeon | ${{ steps.pigeon.outcome }} |"
            echo "| dart format (advisory) | ${{ steps.format.outcome }} |"
            echo "| flutter analyze | ${{ steps.analyze.outcome }} |"
            echo "| flutter test | ${{ steps.test.outcome }} |"
            echo "| build apk (debug) | ${{ steps.apk.outcome }} |"
          } > ci-report/summary.md
          cat ci-report/summary.md

      - name: Publish report to the ci-reports branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ci-report
          git init -q -b ci-reports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "CI report: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-reports

      - name: Gate
        if: always()
        run: |
          fail=0
          check() { if [ "$2" = "failure" ]; then echo "FAILED: $1"; fail=1; fi; }
          check "pub get"       "${{ steps.pub_get.outcome }}"
          check "build_runner"  "${{ steps.build_runner.outcome }}"
          check "pigeon"        "${{ steps.pigeon.outcome }}"
          check "analyze"       "${{ steps.analyze.outcome }}"
          check "test"          "${{ steps.test.outcome }}"
          check "build apk"     "${{ steps.apk.outcome }}"
          exit "$fail"
