include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "build/**"

linter:
  rules:
    # Doc §20: prefer explicit interfaces over ad-hoc "I" prefixes, immutable state,
    # no print() in production code — enforced below.
    - avoid_print
    - prefer_final_locals
    - prefer_final_in_for_each
    - unawaited_futures
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_returning_null_for_future
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - sort_constructors_first
    - use_key_in_widget_constructors
